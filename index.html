
<!DOCTYPE html>
<html lang="es">
  <head>

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧺</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SISLAV - CONTROL TOTAL</title>
    <meta name="description" content="SISLAV - Sistema de Control Total para Lavanderías" />
    <meta property="og:title" content="SISLAV - CONTROL TOTAL" />
    <meta property="og:description" content="Sistema de gestión integral para lavanderías." />
    <meta property="og:image" content="https://lavanderiasislav.com/logo-sislav.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Shim crítico para compatibilidad de librerías en el navegador
      window.process = { env: { API_KEY: "" } };
      
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'DM Sans', 'ui-sans-serif', 'system-ui'],
              heading: ['Outfit', 'Inter', 'sans-serif'],
              display: ['Outfit', 'Inter', 'sans-serif'],
            },
            colors: {
              bg: 'var(--bg)',
              bg2: 'var(--bg2)',
              bg3: 'var(--bg3)',
              surface: 'var(--surface)',
              surface2: 'var(--surface2)',
              text: 'var(--text)',
              text2: 'var(--text2)',
              text3: 'var(--text3)',
              accent: {
                DEFAULT: 'var(--accent)',
                glow: 'var(--accent-glow)',
              },
              sunat: {
                primary: '#0054A6',
                secondary: '#D42D1F',
              },
              brand: {
                primary: 'var(--brand-primary, #4f8ef7)',
                secondary: 'var(--brand-secondary, #22c55e)',
              }
            },
            borderRadius: {
              'radius': '10px',
              'radius-lg': '14px',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand-primary: #4f8ef7;
        --brand-secondary: #22c55e;
        --bg: #0d0f14;
        --bg2: #13161e;
        --bg3: #1a1e28;
        --surface: #1e2330;
        --surface2: #242938;
        --border: rgba(255,255,255,0.07);
        --border2: rgba(255,255,255,0.12);
        --text: #f0f2f7;
        --text2: #8b90a0;
        --text3: #555b6e;
        --accent: #4f8ef7;
        --accent-glow: rgba(79,142,247,0.15);
      }
    </style>

    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('s');
        const ownerId = params.get('o');
        const isLogistica = window.location.pathname.includes('/logistica');
        
        // --- INYECCIÓN INMEDIATA DEL MANIFEST ---
        let manifestUrl = ownerId ? `/manifest.json?o=${ownerId}` : (slug ? `/manifest.json?s=${slug}` : '/manifest.json');
        if (isLogistica) {
          manifestUrl += (manifestUrl.includes('?') ? '&' : '?') + 'type=logistica';
        }
        
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);

        const SUPABASE_URL = 'https://yvgshdypqanlcgxdyvls.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2Z3NoZHlwcWFubGNneGR5dmxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NjYyODIsImV4cCI6MjA4NTE0MjI4Mn0.B65RRA4u5-a_6E-blMvQXMKf39521esSif4XODdzfNE';

        if (slug || ownerId) {
          window.__BRANDING_STATUS__ = 'loading';
          
          let table = ownerId ? 'empresas_holding' : 'sucursales';
          let queryUrl = `${SUPABASE_URL}/rest/v1/${table}?select=*`;
          
          if (slug) {
            queryUrl += `&slug=eq.${slug}`;
          } else if (ownerId) {
            const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(ownerId);
            queryUrl += isUuid ? `&id=eq.${ownerId}` : `&slug=eq.${ownerId}`;
          }
          queryUrl += '&limit=1';

          fetch(queryUrl, {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Range': '0-0'
            }
          })
          .then(r => r.json())
          .then(data => {
            const s = Array.isArray(data) ? data[0] : data;
            if (s) {
              window.__SUCURSAL_BRANDING__ = s;
              window.__BRANDING_STATUS__ = 'ready';
              
              const primary = s.color_primario || '#0054A6';
              const secondary = s.color_secundario || '#10B981';
              
              const root = document.documentElement;
              root.style.setProperty('--brand-primary', primary);
              root.style.setProperty('--brand-secondary', secondary);
              root.style.setProperty('--accent', primary);
              root.style.setProperty('--primary-color', primary);
              
              const razonSocial = s.nombre_sucursal || s.nombre_empresa || s.razon_social || 'SISLAV';
              const isLogistica = window.location.pathname.includes('/logistica');
              document.title = isLogistica ? `LOGÍSTICA ${razonSocial}` : `${razonSocial} - CONTROL TOTAL`;
              
              if (isLogistica) {
                const logo = s.url_favicon_logistica || s.url_favicon || s.url_logo;
                if (logo) {
                  const linkIcon = document.querySelector('link[rel="icon"]');
                  if (linkIcon) linkIcon.setAttribute('href', logo);
                }
              }

              // Inyección dinámica del manifest para PWA corregida
              const manifestLink = document.querySelector('link[rel="manifest"]');
              let manifestUrl = slug ? `/manifest.json?s=${slug}` : (ownerId ? `/manifest.json?o=${ownerId}` : '/manifest.json');
              if (isLogistica) {
                manifestUrl += (manifestUrl.includes('?') ? '&' : '?') + 'type=logistica';
              }
              if (manifestLink) {
                manifestLink.setAttribute('href', manifestUrl);
              } else {
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = manifestUrl;
                document.head.appendChild(link);
              }
            } else {
              window.__BRANDING_STATUS__ = 'failed';
            }
          })
          .catch(e => {
            console.error('❌ [Pre-load] Error:', e);
            window.__BRANDING_STATUS__ = 'failed';
          });
        } else {
          window.__BRANDING_STATUS__ = 'none';
        }
      })();
    </script>

    <style>
      /* Light Theme Overrides */
      .light-theme {
        --bg: #f1f5f9;
        --bg2: #ffffff;
        --bg3: #e2e8f0;
        --surface: #ffffff;
        --surface2: #f8fafc;
        --border: rgba(0,0,0,0.06);
        --border2: rgba(0,0,0,0.12);
        --text: #0f172a;
        --text2: #475569;
        --text3: #94a3b8;
        --accent: #3b82f6;
        --accent-glow: rgba(59,130,246,0.1);
      }
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

      /* Custom utility classes from the provided HTML */
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
      .tbl th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
      .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }

      @keyframes neon-pulse {
        0%, 100% { 
          filter: brightness(1.2) drop-shadow(0 0 3px var(--brand-primary));
          opacity: 0.9;
        }
        50% { 
          filter: brightness(1.8) drop-shadow(0 0 10px var(--brand-primary));
          opacity: 1;
        }
      }
      .neon-badge {
        animation: neon-pulse 1.5s infinite ease-in-out;
        border: 1px solid var(--brand-primary);
        box-shadow: 0 0 8px var(--brand-primary), inset 0 0 4px var(--brand-primary);
        background: transparent;
        color: var(--brand-primary);
        text-shadow: 0 0 5px var(--brand-primary);
        font-weight: 900;
        letter-spacing: 0.05em;
      }
      @keyframes blink-badge {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.95); }
      }
      .animate-blink-badge {
        animation: blink-badge 1.5s infinite;
      }
    </style>

</head>
